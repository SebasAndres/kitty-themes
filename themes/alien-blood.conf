## description: Tu config previa de ~/.config/kitty: JetBrains Mono 13, pestañas powerline, colores Alien Blood sobre Catppuccin Mocha

# ---------- Base de colores: Catppuccin Mocha (MIT, github.com/catppuccin/kitty) ----------
# The basic colors
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc

# Cursor colors
cursor                  #f5e0dc
cursor_text_color       #1e1e2e

# Scrollbar colors
scrollbar_handle_color  #9399b2
scrollbar_track_color   #45475a

# URL color when hovering with mouse
url_color               #f5e0dc

# Kitty window border colors
active_border_color     #b4befe
inactive_border_color   #6c7086
bell_border_color       #f9e2af

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

# Colors for marks (marked text in the terminal)
mark1_foreground #1e1e2e
mark1_background #b4befe
mark2_foreground #1e1e2e
mark2_background #cba6f7
mark3_foreground #1e1e2e
mark3_background #74c7ec

# The 16 terminal colors

# black
color0 #45475a
color8 #585b70

# red
color1 #f38ba8
color9 #f38ba8

# green
color2  #a6e3a1
color10 #a6e3a1

# yellow
color3  #f9e2af
color11 #f9e2af

# blue
color4  #89b4fa
color12 #89b4fa

# magenta
color5  #f5c2e7
color13 #f5c2e7

# cyan
color6  #94e2d5
color14 #94e2d5

# white
color7  #bac2de
color15 #a6adc8

# ── Fuente ────────────────────────────────────────────────────────────────────
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Fallback si no tienes JetBrains Mono
# font_family      monospace

# ── Apariencia ────────────────────────────────────────────────────────────────
background_opacity 0.95
window_padding_width 12
hide_window_decorations no

# Cursor
cursor_shape          beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# ── Pestañas (tabs) ───────────────────────────────────────────────────────────
tab_bar_style             powerline
tab_powerline_style       slanted
tab_bar_min_tabs          1
tab_title_template        " {index}: {title} "
active_tab_font_style     bold

# ── Scrollback ────────────────────────────────────────────────────────────────
scrollback_lines 10000

# ── Mouse ─────────────────────────────────────────────────────────────────────
mouse_hide_wait 2.0
copy_on_select  yes

# ── Atajos personalizados ─────────────────────────────────────────────────────
# Nueva pestaña
map ctrl+t new_tab_with_cwd

# Cerrar pestaña
map ctrl+w close_tab

# Navegar entre tabs
map ctrl+tab     next_tab
map ctrl+shift+tab previous_tab

# Layouts: vertical split first
enabled_layouts splits,stack
map ctrl+shift+enter launch --location=vsplit --cwd=current

# Dividir horizontal
map ctrl+shift+o launch --location=hsplit --cwd=current

# Navegar entre ventanas
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window

# Aumentar/disminuir fuente
map ctrl+equal  change_font_size all +1.0
map ctrl+minus  change_font_size all -1.0
map ctrl+0      change_font_size all 0

# Abrir scrollback en editor
map ctrl+shift+h show_scrollback

# Recargar config sin reiniciar
map ctrl+shift+F5 load_config_file

