# ---------- Fuente ----------
font_family      DejaVu Sans Mono
font_size        12.0
disable_ligatures never

# ---------- Ventana ----------
window_padding_width   12
hide_window_decorations no
background_opacity     0.90
dynamic_background_opacity yes
confirm_os_window_close 0
remember_window_size   yes
initial_window_width   110c
initial_window_height  32c

# ---------- Cursor ----------
cursor_shape           beam
cursor_blink_interval  0.5
cursor_trail           3

# ---------- Pestañas ----------
tab_bar_edge           top
tab_bar_style          separator
tab_separator          " │ "
tab_title_template     "{index}: {title}"
active_tab_font_style  bold

# ---------- Varios ----------
scrollback_lines       10000
enable_audio_bell      no
visual_bell_duration   0.0
url_style              curly
copy_on_select         yes

# ---------- Atajos útiles ----------
map ctrl+shift+t new_tab_with_cwd
# Dividir pantalla
enabled_layouts splits,stack
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+minus launch --location=hsplit --cwd=current
map ctrl+shift+right launch --location=vsplit --cwd=current
map ctrl+shift+down  launch --location=hsplit --cwd=current
map ctrl+shift+z     toggle_layout stack
# Moverse entre paneles con Alt + flechas
map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down
# Cambiar tamaño del panel con Ctrl+Alt + flechas
map ctrl+alt+left  resize_window narrower
map ctrl+alt+right resize_window wider
map ctrl+alt+up    resize_window taller
map ctrl+alt+down  resize_window shorter
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

# ---------- Tema: Xeneize (azul y oro) ----------
foreground              #E6ECF5
background              #061A3A
selection_foreground    #061A3A
selection_background    #FDB913
cursor                  #FDB913
cursor_text_color       #061A3A
url_color               #FFD54F
active_border_color     #FDB913
inactive_border_color   #1E3F7A
bell_border_color       #FDB913
active_tab_foreground   #FDB913
active_tab_background   #061A3A
inactive_tab_foreground #9FB3D9
inactive_tab_background #061A3A

